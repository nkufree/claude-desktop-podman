name: Web desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate backend, HTTP and WebSocket proxy
        run: make check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser JavaScript and blocked-storage fallback
        run: |
          node --check webapp/static/app.js
          node --test tests/test_desktop_storage.cjs
