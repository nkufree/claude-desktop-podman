name: Build and Push Images

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: '桌面社区版本标签（latest 或指定 release tag）'
        required: true
        default: latest
        type: string
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC

jobs:
  desktop:
    name: Desktop (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Resolve desktop image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/claude-desktop" >> "$GITHUB_OUTPUT"
      - name: Resolve community Debian package
        id: package
        uses: actions/github-script@v7
        env:
          DESKTOP_RELEASE: ${{ inputs.release || 'latest' }}
          DESKTOP_ARCH: ${{ matrix.arch }}
        with:
          script: |
            const repo = {owner: 'aaddrick', repo: 'claude-desktop-debian'};
            const tag = process.env.DESKTOP_RELEASE;
            const release = tag === 'latest'
              ? (await github.rest.repos.getLatestRelease(repo)).data
              : (await github.rest.repos.getReleaseByTag({...repo, tag})).data;
            const candidates = release.assets
              .filter(asset => asset.name.endsWith(`_${process.env.DESKTOP_ARCH}.deb`))
              .sort((a, b) => Number(!a.name.startsWith('claude-desktop-unofficial_'))
                - Number(!b.name.startsWith('claude-desktop-unofficial_')) || a.name.localeCompare(b.name));
            if (!candidates.length) throw new Error(`Release ${release.tag_name} has no ${process.env.DESKTOP_ARCH} Debian package`);
            const asset = candidates[0];
            core.setOutput('url', asset.browser_download_url);
            core.setOutput('sha256', asset.digest?.startsWith('sha256:') ? asset.digest.slice(7) : '');
            core.setOutput('release', release.tag_name);
            core.notice(`Installing ${release.tag_name}: ${asset.name}`);
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build desktop image
        uses: docker/build-push-action@v6
        with:
          context: desktop
          file: desktop/Containerfile
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Claude Desktop Linux desktop
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/docs/build-images.md
          build-args: |
            CLAUDE_INSTALL_REV=${{ github.run_id }}-${{ github.run_attempt }}
            CLAUDE_RELEASE=${{ steps.package.outputs.release }}
            CLAUDE_DEB_URL=${{ steps.package.outputs.url }}
            CLAUDE_DEB_SHA256=${{ steps.package.outputs.sha256 }}
          cache-from: type=gha,scope=desktop-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=desktop-${{ matrix.arch }}

  desktop-manifest:
    name: Publish desktop multi-platform image
    needs: desktop
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish latest and commit tags
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/claude-desktop"
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            "$IMAGE:sha-$GITHUB_SHA-amd64" \
            "$IMAGE:sha-$GITHUB_SHA-arm64"
          echo "### Desktop image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE:latest\` (AMD64 / ARM64)" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Legacy Claude Code image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      STORAGE_DRIVER: vfs

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build image with buildah script
      id: build
      run: |
        # The build script prints exactly one line on stdout: "<image>:<version>"
        REF=$(./devops/build-claude.sh)
        echo "image=${REF%%:*}" >> "$GITHUB_OUTPUT"
        echo "version=${REF##*:}" >> "$GITHUB_OUTPUT"

    - name: Tag and push to GitHub Container Registry
      if: github.event_name != 'pull_request'
      env:
        IMAGE: ${{ steps.build.outputs.image }}
        VERSION: ${{ steps.build.outputs.version }}
      run: |
        REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

        buildah tag "$IMAGE" \
          "ghcr.io/$REPO_NAME/$IMAGE:$VERSION" \
          "ghcr.io/$REPO_NAME/$IMAGE:latest"

        buildah push "ghcr.io/$REPO_NAME/$IMAGE:$VERSION"
        buildah push "ghcr.io/$REPO_NAME/$IMAGE:latest"
